## Docs: https://docs.meteostudios.net/packages/meteo-v2-package/configuration-guide#meteo.cfg
## Get Free Support From: https://discord.gg/P5cPsVTNZf

# -----------------------------------------------
# Meteo Studios V2 Package Configuration
# -----------------------------------------------

# Server
setr meteo:name "Meteo Studios"   # Display name shown across meteo UIs
setr meteo:logo "https://r2.fivemanage.com/ND1ABtrhOCiEbMgp1LFCW/meteostudios.png"

# Currency symbol shown in shops, menus, and HUDs (e.g., "$", "€", "£")
setr meteo:currency "$"

# Speed unit displayed in HUD and police radar ('mph' or 'kmh')
setr meteo:speedunit "mph"

# Max players allowed in a group for crime activities and civilian jobs
setr meteo:groupmaxMembers 4

# -----------------------------------------------
# Discord Rich Presence
# -----------------------------------------------

set meteo:discord_enabled true
set meteo:discord_player_count true
set meteo:discord_app_id "1483876608329777183"
set meteo:discord_icon_large "meteo_logo_large"
set meteo:discord_icon_small "meteo_logo_small"
set meteo:discord_btn1_text "Get Yours Now!"
set meteo:discord_btn1_url "https://meteostudios.net/"
set meteo:discord_btn2_text "Join Our Discord"
set meteo:discord_btn2_url "https://discord.gg/P5cPsVTNZf"

# -----------------------------------------------
# Meteo Phone - API Keys
# -----------------------------------------------

set meteo:phone_fivemanage_token "YOUR_KEY_HERE"
set meteo:phone_cf_turn_token_id "YOUR_KEY_HERE"
set meteo:phone_cf_turn_api_token "YOUR_KEY_HERE"

# -----------------------------------------------
# Meteo Mdt - API Keys
# -----------------------------------------------
set meteo:mdt_fivemanage_token "YOUR_KEY_HERE"

# -----------------------------------------------
# Meteo Crime
# -----------------------------------------------

setr meteo:cryptoname "METEO"        # Full coin name
setr meteo:cryptosymbol "MTC"        # Short ticker shown in UIs, rewards and logs
setr meteo:walletprefix "MTEO-"      # Wallet address prefix, e.g. MTEO-XXXX-XXXX (max 11 chars)

# Crime tablet terminal prompt
setr meteo:terminalprompt "~/meteo/"

# -----------------------------------------------
# Meteo Chat
# -----------------------------------------------

setr meteo:chat_welcome "Welcome to Meteo Studios! Press T to open chat and type / to see available commands."

# Rotating auto-messages. Separate each message with a pipe '|'
setr meteo:chat_automessages "Don't Forget to join Meteo Discord!|Don't break the rules!|Have fun!|Remember to roleplay realistically!|Report any bugs or issues to discord.gg/P5cPsVTNZf!"

# Set to true on non-production servers - enables debug output, test shortcuts, etc.
setr meteo:testserver false

# Must be set to true to confirm you've read the documentation and ToS
setr meteo:acknowledge true