## Docs: https://docs.meteostudios.net/packages/meteo-v2-package
## Get Free Support From: https://discord.gg/P5cPsVTNZf
## Installation Guide: https://docs.meteostudios.net/packages/meteo-v2-package/installation-guide

## You CAN edit the following:
{{serverEndpoints}}
sv_maxclients 8 # Max player slots. Keep at `8` to stream custom clothing for free. If you need more than 8 slots, you need **Argentum** or higher subscription from https://portal.cfx.re/subscriptions
set steam_webApiKey "none"
sets tags "meteostudios.net, roleplay, optimized, custommade"

## You MAY edit the following:
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}}"
sets sv_projectName "Meteo Studios V2 Package"
sets sv_projectDesc "Stop buying problems. Start buying solutions."
sets locale "en-US"
load_server_icon logo.png
sv_enforceGameBuild 3751 #A Safehouse in the Hills
set resources_useSystemChat true
setr game_enableDynamicDoorCreation "true"
set mysql_connection_string "{{dbConnectionString}}"

# Ox resources config
exec ox.cfg
exec qbox.cfg # qbox
exec meteo.cfg # meteo package config
exec voice.cfg

# weathersync
setr weather_disablecd true

# These resources will start by default. (DO NOT MODIFY BELOW)
ensure mapmanager
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents
ensure ox_lib ## DONT CHANGE
ensure msv2-versioncheck ## DONT CHANGE OR RENAME THIS

ensure meteo-core
ensure meteo-chat ## DONT CHANGE
ensure [ox]
ensure meteo-inventory
ensure [qb]
ensure [standalone]
ensure [voice]
ensure [meteostudios]
ensure [assets]

exec permissions.cfg
exec misc.cfg

sets ServerBuild "v2.12.0"
sets Discord "https://discord.gg/P5cPsVTNZf"
sets Website "https://meteostudios.net"
sets Documentation "https://docs.meteostudios.net/packages/meteo-v2-package"
set sv_listingIPOverride "0.0.0.0"    # Put your server ip with port
sets banner_detail "https://r2.fivemanage.com/ND1ABtrhOCiEbMgp1LFCW/v2packagebanner.gif"
sets banner_connecting "https://r2.fivemanage.com/ND1ABtrhOCiEbMgp1LFCW/v2packagebanner.gif"